name: Sync Upstream & Build

on:
  schedule:
    - cron: '0 */6 * * *' # check every 6 hours
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.upstream.outputs.version }}
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - name: Checkout github-desktop-wsl
        uses: actions/checkout@v6

      - name: Get latest upstream release tag
        id: upstream
        run: |
          LATEST=$(git ls-remote --tags https://github.com/desktop/desktop.git 'refs/tags/release-*' \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -v -E '(beta|test)' \
            | sort -V \
            | tail -1)
          VERSION=$(echo "$LATEST" | sed 's/^release-//')
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $LATEST"

      - name: Check if we already have this version
        id: check
        run: |
          tag="wsl-${{ steps.upstream.outputs.version }}"
          # Get the list of existing release tags. We must distinguish three cases:
          #   1. the tag exists            -> skip (already released)
          #   2. the tag is absent         -> build (genuinely new upstream)
          #   3. the API call itself fails -> skip (transient error; never risk a duplicate build/release)
          # The old `gh release view ... || skip=false` collapsed cases 2 and 3, so a transient
          # API blip looked like a new version and spuriously triggered a build.
          if ! tags=$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' 2>err.txt); then
            echo "::warning::Could not list releases (API error); skipping to avoid a spurious build."
            cat err.txt || true
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -qxF "$tag" <<<"$tags"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already released $tag"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release: ${{ steps.upstream.outputs.tag }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger build
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dispatch the build, retrying transient failures (e.g. the intermittent
          # 401 "Requires authentication" the GitHub API can return). A single blip
          # must not silently skip a release of a new upstream version.
          for attempt in 1 2 3 4 5; do
            if gh workflow run build-release.yml \
              --repo "${{ github.repository }}" \
              --ref main \
              -f version="${{ steps.upstream.outputs.version }}" \
              -f upstream_tag="${{ steps.upstream.outputs.tag }}"; then
              echo "Dispatched build for ${{ steps.upstream.outputs.tag }} (attempt $attempt)"
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          echo "::error::Failed to dispatch build after 5 attempts"
          exit 1
